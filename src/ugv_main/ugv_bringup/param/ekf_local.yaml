ekf_local_filter_node:
    ros__parameters:
        use_sim_time: false
        frequency: 30.0
        sensor_timeout: 0.1
        two_d_mode: true
        transform_time_offset: 0.0
        transform_timeout: 0.0
        print_diagnostics: false
        publish_tf: true
        publish_acceleration: false
        reset_on_time_jump: true

        odom_frame: odom
        base_link_frame: base_footprint
        world_frame: odom

        # Wheel odometry position/yaw fusion fully removed here per request
        # to test an IMU(mag)+UWB-only configuration end-to-end. KNOWN RISK:
        # with odom0 fully disabled, this filter's own x/y position state
        # has NO measurement at all (imu0 only provides orientation, not
        # position) - it will likely free-run/drift unconstrained, the same
        # class of bug fixed earlier for yaw in ekf_global.yaml. If that
        # happens, restore odom0_config to
        # [true,true,false / false,false,true / true,false,false /
        #  false,false,true / false,false,false] and set imu0 back to all
        # false below.
        odom0: /odom_raw
        odom0_config: [false, false, false,
                       false, false, false,
                       false, false, false,
                       false, false, false,
                       false, false, false]
        odom0_queue_size: 10
        odom0_nodelay: false
        odom0_differential: false
        odom0_relative: false
        odom0_pose_rejection_threshold: 20.0
        odom0_twist_rejection_threshold: 1.542

        imu0: /imu/data
        # Re-enabled yaw/vyaw to replace the removed wheel-based yaw, now
        # using the magnetometer-corrected orientation (use_mag:=True in
        # the launch file).
        imu0_config: [false, false, false,
                      false, false, true,
                      false, false, false,
                      false, false, true,
                      false, false, false]
        imu0_queue_size: 10
        imu0_nodelay: false
        imu0_differential: false
        imu0_relative: true
        imu0_pose_rejection_threshold: 20.0
        imu0_twist_rejection_threshold: 1.542
        imu0_linear_acceleration_rejection_threshold: 10.0
        imu0_remove_gravitational_acceleration: false
ekf_local_filter_node:
    ros__parameters:
        use_sim_time: false
        frequency: 30.0
        sensor_timeout: 0.1
        two_d_mode: true
        transform_time_offset: 0.0
        transform_timeout: 0.0
        print_diagnostics: false
        publish_tf: true
        publish_acceleration: false
        reset_on_time_jump: true

        odom_frame: odom
        base_link_frame: base_footprint
        world_frame: odom

        odom0: /odom_raw
        odom0_config: [true, true, false,
                       false, false, true,
                       true, false, false,
                       false, false, true,
                       false, false, false]
        odom0_queue_size: 10
        odom0_nodelay: false
        odom0_differential: false
        odom0_relative: false
        odom0_pose_rejection_threshold: 20.0
        odom0_twist_rejection_threshold: 1.542

        imu0: /imu/data
        # Disabled again: re-enabling yaw/vyaw caused a MUCH WORSE, fast
        # runaway rotation in RViz (~360 deg every 2s), likely a sign/
        # convention mismatch between the IMU's yaw-rate and the wheel
        # odometry's yaw-rate causing EKF instability when fusing both
        # simultaneously. Needs the IMU's angular_velocity.z sign to be
        # directly compared against a known physical rotation direction
        # (and against odom0's vyaw sign) before trying again.
        imu0_config: [false, false, false,
                      false, false, false,
                      false, false, false,
                      false, false, false,
                      false, false, false]
        imu0_queue_size: 10
        imu0_nodelay: false
        imu0_differential: false
        imu0_relative: true
        imu0_pose_rejection_threshold: 20.0
        imu0_twist_rejection_threshold: 1.542
        imu0_linear_acceleration_rejection_threshold: 10.0
        imu0_remove_gravitational_acceleration: false
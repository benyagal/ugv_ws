ekf_local_filter_node:
    ros__parameters:
        use_sim_time: false
        frequency: 30.0
        sensor_timeout: 0.1
        two_d_mode: true
        transform_time_offset: 0.0
        transform_timeout: 0.0
        print_diagnostics: false
        publish_tf: true
        publish_acceleration: false
        reset_on_time_jump: true

        odom_frame: odom
        base_link_frame: base_footprint
        world_frame: odom

        odom0: /odom_raw
        odom0_config: [true, true, false,
                       false, false, true,
                       true, false, false,
                       false, false, true,
                       false, false, false]
        odom0_queue_size: 10
        odom0_nodelay: false
        odom0_differential: false
        odom0_relative: false
        odom0_pose_rejection_threshold: 20.0
        odom0_twist_rejection_threshold: 1.542

        imu0: /imu/data
        # Re-enabled yaw/vyaw: the ICM20948 previously produced bit-identical
        # (frozen) raw gyro/accel data even while physically driving the
        # robot, confirmed dead at the hardware/firmware level. Retested and
        # /imu/data_raw now shows genuine sample-to-sample noise-level
        # variation (not frozen), so fusing yaw again.
        imu0_config: [false, false, false,
                      false, false, true,
                      false, false, false,
                      false, false, true,
                      false, false, false]
        imu0_queue_size: 10
        imu0_nodelay: false
        imu0_differential: false
        imu0_relative: true
        imu0_pose_rejection_threshold: 20.0
        imu0_twist_rejection_threshold: 1.542
        imu0_linear_acceleration_rejection_threshold: 10.0
        imu0_remove_gravitational_acceleration: false
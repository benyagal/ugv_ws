ekf_local_filter_node:
    ros__parameters:
        use_sim_time: false
        frequency: 30.0
        sensor_timeout: 0.1
        two_d_mode: true
        transform_time_offset: 0.0
        transform_timeout: 0.0
        print_diagnostics: false
        publish_tf: true
        publish_acceleration: false
        reset_on_time_jump: true

        odom_frame: odom
        base_link_frame: base_footprint
        world_frame: odom

        # Wheel odometry POSE (x/y/yaw) stays disabled - yaw comes from the
        # IMU and absolute position from UWB via ekf_global. But the forward
        # VELOCITY (vx) is fused: without it this filter had no translational
        # measurement at all, so its x/y state never left 0 and odom->base
        # was pure rotation. That made the robot's pose in the odom frame
        # constant, which (a) permanently trips SimpleProgressChecker and
        # (b) forces every bit of real motion into the map->odom correction,
        # so UWB noise shook the whole local costmap each update - both show
        # up as erratic/jerky navigation. vx is dead reckoning and will
        # drift, which is exactly what the map->odom correction is for.
        odom0: /odom_raw
        odom0_config: [false, false, false,
                       false, false, false,
                       true,  false, false,
                       false, false, false,
                       false, false, false]
        odom0_queue_size: 10
        odom0_nodelay: false
        odom0_differential: false
        odom0_relative: false
        odom0_pose_rejection_threshold: 20.0
        odom0_twist_rejection_threshold: 1.542

        imu0: /imu/data
        # Re-enabled yaw/vyaw to replace the removed wheel-based yaw, now
        # using pure gyro (no magnetometer - ruled out, see launch file).
        imu0_config: [false, false, false,
                      false, false, true,
                      false, false, false,
                      false, false, true,
                      false, false, false]
        imu0_queue_size: 10
        imu0_nodelay: false
        imu0_differential: false
        # Changed from true: with imu0_relative, this filter tracks yaw
        # relative to the FIRST /imu/data measurement received since node
        # startup, independent of any later set_pose call - the set_pose
        # (used to give an initial heading via RViz's "2D Pose Estimate")
        # resets the filter's own state, but NOT this relative reference,
        # so the two could disagree/interact badly. Confirmed via testing:
        # raw /imu/data (bypassing the EKF) had the CORRECT sign convention
        # for a physical rotation, but the full EKF+set_pose pipeline gave
        # the OPPOSITE sign for the same real rotation direction - pointing
        # squarely at this relative-reference vs. set_pose interaction.
        # Fusing imu0 as an absolute measurement avoids this entirely.
        imu0_relative: false
        imu0_pose_rejection_threshold: 20.0
        imu0_twist_rejection_threshold: 1.542
        imu0_linear_acceleration_rejection_threshold: 10.0
        imu0_remove_gravitational_acceleration: false
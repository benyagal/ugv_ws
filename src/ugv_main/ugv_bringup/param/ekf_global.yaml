ekf_global_filter_node:
    ros__parameters:
        use_sim_time: false
        frequency: 20.0
        sensor_timeout: 0.2
        two_d_mode: true
        transform_time_offset: 0.0
        transform_timeout: 0.0
        print_diagnostics: false
        publish_tf: true
        publish_acceleration: false
        reset_on_time_jump: true

        map_frame: map
        odom_frame: odom
        base_link_frame: base_footprint
        world_frame: map

        # Wheel odometry POSITION fusion disabled (x,y false): the base
        # chassis track width / scale hasn't been re-verified since the
        # rebuild, so its position estimate isn't trustworthy yet. UWB alone
        # (once its own accuracy/update rate is improved) is currently more
        # reliable for x/y.
        #
        # yaw/vyaw stay enabled here (odom0_config below), but NOTE: this no
        # longer carries wheel-based yaw at all - ekf_local.yaml now fully
        # disables its own odom0 (wheel) and instead fuses imu0 (mag-
        # corrected IMU) for yaw, so /odometry/local's yaw is IMU-derived by
        # the time it reaches this filter. Deliberately NOT adding a
        # separate direct imu0 input here too - that would double-fuse the
        # same IMU yaw signal through two channels (once via this odom0,
        # once directly), which is exactly what caused the fast runaway
        # rotation bug earlier when base_node.cpp's own yaw became IMU-
        # derived while ekf_local also fused imu0 directly.
        odom0: /odometry/local
        odom0_config: [false, false, false,
                       false, false, true,
                       false, false, false,
                       false, false, true,
                       false, false, false]
        odom0_queue_size: 10
        odom0_nodelay: false
        odom0_differential: false
        odom0_relative: false
        odom0_pose_rejection_threshold: 20.0
        odom0_twist_rejection_threshold: 1.542

        pose0: /uwb/pose
        pose0_config: [true, true, false,
                       false, false, false,
                       false, false, false,
                       false, false, false,
                       false, false, false]
        pose0_queue_size: 10
        pose0_nodelay: false
        pose0_differential: false
        pose0_relative: false
        # Widened from 5.0: with the tight UWB covariance, 5 sigma was only
        # ~7cm - real drift between the ~8-10s UWB updates regularly exceeded
        # that, so corrections were silently rejected as outliers.
        pose0_rejection_threshold: 15.0
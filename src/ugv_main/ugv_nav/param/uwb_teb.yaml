# Nav2 parameters for TEB local planning driven by the UWB+IMU EKF
# localization chain (bringup_localization_uwb.launch.py) instead of AMCL.
#
# No AMCL / map_server / map_saver sections here: localization (map->odom TF)
# and the static map are both provided by bringup_localization_uwb.launch.py
# already (map_server is launched there purely to feed the costmaps' static
# layer below - not for scan-matching localization).
#
# No live obstacle sensor yet (no LIDAR in production, camera-based chicken
# detection not implemented yet) - both costmaps only carry a static_layer
# (for wall-awareness from the pre-built map) + inflation_layer. Adding
# camera obstacles later should just mean adding a new layer to the
# "plugins" lists below, not rewriting this file.
#
# Frames used throughout: odom_frame=odom, base_link_frame=base_footprint,
# map_frame=map - matching ekf_local.yaml / ekf_global.yaml exactly (the
# older amcl_teb.yaml inconsistently mixed base_footprint/base_link, do not
# repeat that here).

bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odometry/local
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_is_battery_charging_condition_bt_node

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: False

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: False

controller_server:
  ros__parameters:
    use_sim_time: False
    # Lowered from 20.0 (2026-09-17) - the Jetson couldn't keep up with TEB
    # optimization + costmap_converter at 20Hz, causing near-constant "missed
    # rate" warnings that cascaded into progress-checker failures. Revisit
    # upward only after confirming actual achieved rate with homotopy class
    # planning disabled.
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    # Raised from 0.3: UWB regularly jumps 20-40cm, which briefly puts the
    # footprint in a wall cell and makes TEB report "trajectory is not
    # feasible". At 0.3s a single such jump exceeded controller patience and
    # aborted the whole path into a backup/spin recovery.
    failure_tolerance: 2.0
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      # Raised with the lowered speeds below - 0.5m at 0.15 m/s plus an
      # in-place rotation no longer fits comfortably in 10s.
      movement_time_allowance: 15.0
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
    # TEB local planner, wrapped in the rotation-shim controller so the robot
    # rotates in place toward the path heading before TEB takes over driving
    # forward (same tuning already validated in amcl_teb.yaml).
    FollowPath:
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "teb_local_planner::TebLocalPlannerROS"
      angular_dist_threshold: 0.785
      forward_sampling_distance: 0.5
      rotate_to_heading_angular_vel: 0.75
      max_angular_accel: 0.75
      simulate_ahead_time: 1.0
      footprint_model.type: circular
      footprint_model.radius: 0.1
      min_obstacle_dist: 0.1
      inflation_dist: 0.1
      # Converter disabled: it re-clusters the costmap into polygons every
      # cycle, which with a static-only costmap buys nothing and was a large
      # share of the CPU behind the constant "control loop missed its rate".
      costmap_converter_plugin: ""
      costmap_converter_spin_thread: False
      # No live obstacle sensor (see file header) - there are no dynamic
      # obstacles to route around, so homotopy-class (multi-topology)
      # planning has zero benefit here and was the single biggest CPU cost,
      # causing the control loop to badly miss its 20Hz rate (confirmed
      # 2026-09-17: near-constant "Control loop missed its desired rate"
      # warnings cascading into progress-checker/patience-exceeded failures).
      enable_homotopy_class_planning: False
      enable_multithreading: True
      optimization_verbose: False
      teb_autoresize: True
      min_samples: 3
      max_samples: 20
      # Defaults (5/4) run 20 optimizer passes per control cycle - far more
      # than the Jetson can afford at 10Hz.
      no_inner_iterations: 3
      no_outer_iterations: 2
      # Only check the pose the robot is actually about to occupy: with no
      # live obstacle sensor the "obstacles" are just static map walls, and
      # checking 5 poses ahead against a UWB-jittered pose produced constant
      # false infeasibility reports.
      feasibility_check_no_poses: 2
      max_global_plan_lookahead_dist: 1.0
      visualize_hc_graph: False
      # Lowered 2026-09-18: with only UWB (~10-20cm residual) for position and
      # no live obstacle sensor, there is nothing to gain from driving fast,
      # and the higher limits produced visibly overshooting/weaving motion.
      # Raised ~50% again 2026-09-22 after the loose wheels were found and
      # tightened: the reduced limits then read as sluggish, and the low
      # angular accel kept the drivetrain inside its ~30 duty deadband for
      # most of every turn's ramp-up.
      max_vel_x: 0.225
      max_vel_x_backwards: 0.15
      max_vel_theta: 0.75
      acc_lim_x: 0.45
      acc_lim_theta: 0.75

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: False
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05
      robot_radius: 0.1
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      always_send_full_costmap: False

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: False
      robot_radius: 0.1
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.3
      always_send_full_costmap: False

planner_server:
  ros__parameters:
    # Lowered from 20.0 - nothing replans that fast here, and the unmet rate
    # was both a constant warning and real CPU contention with the controller.
    expected_planner_frequency: 5.0
    use_sim_time: False
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: False
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    use_sim_time: False
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    # Recovery behaviours (Spin/BackUp) bypass the controller's own limits,
    # so they need matching reductions or they stay the most violent motion
    # the robot ever makes.
    max_rotational_vel: 0.75
    min_rotational_vel: 0.3
    rotational_acc_lim: 1.5

waypoint_follower:
  ros__parameters:
    use_sim_time: False
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    # This is the last stage before /cmd_vel reaches the motors, so it is the
    # only place that also caps recovery behaviours and any manual publisher.
    # The old accel limits (2.5 / 3.2) were far above the planner's own and
    # therefore smoothed nothing at all.
    max_velocity: [0.225, 0.0, 0.75]
    min_velocity: [-0.15, 0.0, -0.75]
    max_accel: [0.45, 0.0, 0.75]
    max_decel: [-0.75, 0.0, -1.5]
    odom_topic: "/odometry/local"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
